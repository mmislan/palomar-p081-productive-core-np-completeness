    "name": "Unconstrained detection of productive autocatalytic cores is NP-complete",
    "description": "Kosc, Kuperberg, Rajon and Charlat (PNAS 122, e2421274122, 2025, Section 2.1) left open the complexity of detecting an autocatalytic core without a prescribed target species or allowed-food set. For finite reversible reaction networks with literal nonnegative integer reactant and product matrices, this unconstrained detection problem is proved NP-complete. A core is a nonempty entity/reaction pair, minimal under componentwise inclusion, with a selected reactant and product in every selected reaction and a signed real flow that strictly produces every selected entity. The input uses a canonical binary encoding. NP membership and a total polynomial-time many-one reduction from SAT are formalized using Complexitylib’s multi-tape Turing machines, including the Cook–Levin theorem.",
